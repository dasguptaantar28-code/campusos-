name: campusos_mobile
description: CampusOS — Enterprise Multi-Tenant School Management Flutter Android Application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.3
  device_info_plus: ^11.3.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/campusos-logo.jpg
    - assets/images/campusos-banner.jpg
